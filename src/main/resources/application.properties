spring.application.name=marketing-digital
server.port=8081

# ===================================================================
# UNIDADE DE PERSISTENCIA E CONEXAO AO BANCO RELACIONAL (FASE 05)
# ===================================================================
# Persistencia real gravada em disco na pasta ./data/marketing_db
spring.datasource.url=jdbc:h2:file:./data/marketing_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Painel visual do Banco de Dados no navegador: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# CONFIGURACOES DO JPA / HIBERNATE
# ===================================================================
# Cria/atualiza automaticamente as tabelas com base nas tuas Entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURACOES DO THYMELEAF
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8