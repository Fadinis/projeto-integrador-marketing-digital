<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erro - Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">
    <div class="alert alert-danger shadow-sm">
        <h5 class="alert-heading fw-bold">Não foi possível concluir a operação</h5>
        <p class="mb-3" th:text="${mensagemErro}">Erro inesperado.</p>
        <a th:href="@{/dashboard}" class="btn btn-outline-danger btn-sm">Voltar ao Dashboard</a>
    </div>
</div>
</body>
</html>
