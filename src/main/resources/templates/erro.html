<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro — Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css(v=2.0)}">
</head>
<body>
<div class="main-wrapper">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-5" style="max-width: 680px;">
        <div class="card shadow-sm border-0 p-4 p-md-5 text-center">
            <div class="kpi-icon-box kpi-icon-red mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h4 class="fw-bold mb-2" style="color: var(--text-heading);">Não foi possível processar a operação</h4>
            <p class="text-muted mb-4 small" th:text="${mensagemErro}">Erro inesperado.</p>
            <div>
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="bi bi-house"></i> Voltar ao Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
