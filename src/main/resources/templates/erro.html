<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro — Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
<div class="main-wrapper">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-5" style="max-width: 720px;">
        <div class="card border-0 shadow-sm p-4">
            <h4 class="fw-bold mb-2" style="color: var(--color-danger);">Não foi possível concluir a operação</h4>
            <p class="text-muted mb-4" th:text="${mensagemErro}">Erro inesperado.</p>
            <div>
                <a th:href="@{/dashboard}" class="btn btn-primary">Voltar ao Dashboard</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
