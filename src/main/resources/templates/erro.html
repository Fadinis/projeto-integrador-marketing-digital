<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro &bull; Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css(v=2.0)}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/navbar :: sidebar('dashboard')}"></div>
    <div class="app-content">
        <div th:replace="~{fragments/navbar :: topbar('Ops! Algo deu errado')}"></div>
        <main class="p-4 flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="hs-card text-center p-4 p-md-5" style="max-width: 600px; width: 100%;">
                <div class="mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem; border-radius: 16px; background-color: rgba(245, 158, 11, 0.15); color: var(--hs-amber); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(245, 158, 11, 0.3);">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h4 class="fw-bold text-white mb-2">Não foi possível processar a operação</h4>
                <p class="small mb-4" style="color: var(--hs-text-muted);" th:text="${mensagemErro}">Erro inesperado na solicitação.</p>
                <div>
                    <a th:href="@{/dashboard}" class="btn-hs-primary">
                        <i class="bi bi-house"></i> Voltar ao Dashboard
                    </a>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
