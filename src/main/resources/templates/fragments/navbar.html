<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">Marketing Analytics</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/campanhas}">Campanhas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/anuncios}">Anúncios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contas}">Contas Anunciantes</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3 text-light small">
                <div>
                    <span class="text-secondary">Usuário:</span>
                    <strong sec:authentication="name">usuario@eseg.edu.br</strong>
                    <span class="badge bg-secondary ms-1" sec:authentication="principal.authorities">ROLE</span>
                </div>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
                </form>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
