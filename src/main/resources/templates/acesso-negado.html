<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado &bull; Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css(v=2.0)}">
</head>
<body class="d-flex align-items-center justify-content-center p-3"
      style="min-height: 100vh; background: radial-gradient(circle at 50% 25%, rgba(244, 63, 94, 0.12) 0%, #0E1015 75%) !important;">
<div class="hs-card text-center p-4 p-md-5" style="max-width: 480px; width: 100%;">
    <div class="mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem; border-radius: 16px; background-color: rgba(244, 63, 94, 0.15); color: #FB7185; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(244, 63, 94, 0.3);">
        <i class="bi bi-shield-x"></i>
    </div>
    <h1 class="display-5 fw-bold mb-1" style="color: var(--hs-rose);">403</h1>
    <h5 class="fw-bold text-white mb-2">Acesso Não Autorizado</h5>
    <p class="small mb-4" style="color: var(--hs-text-muted);">
        O seu perfil de usuário atual não possui permissões no servidor para executar esta operação ou acessar esta rota restrita (Regra de Segurança RBAC).
    </p>
    <a th:href="@{/dashboard}" class="btn-hs-primary w-100 py-2 justify-content-center">
        <i class="bi bi-arrow-left"></i> Retornar ao Painel Principal
    </a>
</div>
</body>
</html>
