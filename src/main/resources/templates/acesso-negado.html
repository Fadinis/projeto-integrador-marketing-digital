<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado — Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css(v=2.0)}">
</head>
<body class="d-flex align-items-center justify-content-center p-3" style="min-height: 100vh;">
<div class="card shadow-sm border-0 text-center p-4 p-md-5" style="max-width: 480px; border-radius: 20px !important;">
    <div class="kpi-icon-box kpi-icon-red mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
        <i class="bi bi-shield-x"></i>
    </div>
    <h1 class="display-5 fw-bold mb-1" style="color: #DC2626;">403</h1>
    <h5 class="fw-bold mb-2" style="color: var(--text-heading);">Acesso Não Autorizado</h5>
    <p class="text-muted small mb-4">
        O seu perfil de usuário atual não possui permissões no servidor para executar esta operação ou acessar esta rota restrita.
    </p>
    <a th:href="@{/dashboard}" class="btn btn-primary w-100 py-2">
        <i class="bi bi-arrow-left"></i> Retornar ao Painel Principal
    </a>
</div>
</body>
</html>
