<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado — Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex align-items-center justify-content-center p-3" style="min-height: 100vh;">
<div class="card shadow-sm border-0 text-center p-4" style="max-width: 480px;">
    <h1 class="display-4 fw-bold" style="color: var(--color-danger);">403</h1>
    <h5 class="fw-bold mb-2" style="color: var(--color-primary-dark);">Acesso Negado (HTTP 403)</h5>
    <p class="text-muted small mb-4">
        O seu perfil de usuário não possui permissão para executar esta operação ou acessar este recurso.
    </p>
    <a th:href="@{/dashboard}" class="btn btn-primary">Voltar ao Painel Principal</a>
</div>
</body>
</html>
