<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Anúncio — Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container pb-5" style="max-width: 720px;">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="fw-bold mb-0" th:text="${anuncio.idAnuncio == null ? 'Novo Anúncio' : 'Editar Anúncio #' + anuncio.idAnuncio}">Anúncio</h5>
        </div>
        <div class="card-body p-4">

            <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

            <form th:action="@{/anuncios/salvar}" th:object="${anuncio}" method="post">
                <input type="hidden" th:field="*{idAnuncio}">

                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Campanha Vinculada *</label>
                        <select class="form-select" th:field="*{campanha.idCampanha}" required>
                            <option value="">Selecione a campanha...</option>
                            <option th:each="cp : ${campanhas}"
                                    th:value="${cp.idCampanha}"
                                    th:text="${cp.nomeCampanha + ' (' + cp.statusCampanha + ')'}"></option>
                        </select>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Nome do Anúncio *</label>
                        <input type="text" class="form-control" th:field="*{nomeAnuncio}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('nomeAnuncio')}" th:errors="*{nomeAnuncio}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Formato *</label>
                        <input type="text" class="form-control" th:field="*{formato}" placeholder="Vídeo, Carrossel, Texto" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Versão Teste A/B *</label>
                        <select class="form-select" th:field="*{versaoTesteAb}" required>
                            <option value="A">Versão A</option>
                            <option value="B">Versão B</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Linha Criativa *</label>
                        <input type="text" class="form-control" th:field="*{linhaCriativa}" placeholder="Ex: Depoimento" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Nota Qualidade (0–10) *</label>
                        <input type="number" step="0.1" min="0" max="10" class="form-control" th:field="*{notaQualidadeCriativo}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('notaQualidadeCriativo')}" th:errors="*{notaQualidadeCriativo}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Status *</label>
                        <select class="form-select" th:field="*{statusAnuncio}" required>
                            <option th:each="st : ${statusOpcoes}" th:value="${st}" th:text="${st}"></option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/anuncios}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Anúncio</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
