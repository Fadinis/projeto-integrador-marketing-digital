<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Anúncio &bull; Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css(v=2.0)}">
</head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/navbar :: sidebar('anuncios')}"></div>

    <div class="app-content">
        <div th:replace="~{fragments/navbar :: topbar(${anuncio.idAnuncio == null ? 'Novo Anúncio' : 'Editar Anúncio'})}"></div>

        <main class="p-4 flex-grow-1 d-flex justify-content-center">
            <div style="width: 100%; max-width: 780px;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold text-white mb-1"
                            th:text="${anuncio.idAnuncio == null ? 'Novo Criativo / Peça de Anúncio' : 'Editar Anúncio #' + anuncio.idAnuncio}">Anúncio</h4>
                        <p class="small mb-0" style="color: var(--hs-text-muted);">Configuração de criativo, teste A/B e índices de qualidade</p>
                    </div>
                    <a th:href="@{/anuncios}" class="btn-hs-outline">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                </div>

                <div th:if="${mensagemErro}" class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-4"
                     style="background-color: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #FB7185; border-radius: 12px;">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${mensagemErro}"></span>
                </div>

                <div class="hs-card">
                    <form th:action="@{/anuncios/salvar}" th:object="${anuncio}" method="post">
                        <input type="hidden" th:field="*{idAnuncio}">

                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Campanha Vinculada *</label>
                                <select class="form-select" th:field="*{campanha.idCampanha}" required>
                                    <option value="">Selecione a campanha...</option>
                                    <option th:each="cp : ${campanhas}"
                                            th:value="${cp.idCampanha}"
                                            th:text="${cp.nomeCampanha + ' (' + cp.statusCampanha + ')'}"></option>
                                </select>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label">Nome do Anúncio *</label>
                                <input type="text" class="form-control" th:field="*{nomeAnuncio}" placeholder="Ex: Vídeo Reels - Depoimento Cliente" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nomeAnuncio')}" th:errors="*{nomeAnuncio}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Formato *</label>
                                <input type="text" class="form-control" th:field="*{formato}" placeholder="Vídeo, Imagem, Carrossel" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Versão Teste A/B *</label>
                                <select class="form-select" th:field="*{versaoTesteAb}" required>
                                    <option value="A">Versão A</option>
                                    <option value="B">Versão B</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Linha Criativa *</label>
                                <input type="text" class="form-control" th:field="*{linhaCriativa}" placeholder="Ex: Dor, Prova Social, Humor" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Nota Qualidade (0 a 10) *</label>
                                <input type="number" step="0.1" min="0" max="10" class="form-control" th:field="*{notaQualidadeCriativo}" placeholder="8.5" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('notaQualidadeCriativo')}" th:errors="*{notaQualidadeCriativo}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Status do Anúncio *</label>
                                <select class="form-select" th:field="*{statusAnuncio}" required>
                                    <option th:each="st : ${statusOpcoes}" th:value="${st}" th:text="${st}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3" style="border-top: 1px solid var(--hs-border);">
                            <a th:href="@{/anuncios}" class="btn-hs-outline">
                                <i class="bi bi-x-lg"></i> Cancelar
                            </a>
                            <button type="submit" class="btn-hs-primary">
                                <i class="bi bi-check-lg"></i> Salvar Anúncio
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
