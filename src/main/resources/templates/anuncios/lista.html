<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anúncios — Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<div class="main-wrapper">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container pb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0" style="color: var(--color-primary-dark);">Criativos e Anúncios</h3>
                <p class="text-muted small mb-0">Peças publicitárias, testes A/B e índices de qualidade</p>
            </div>
            <div sec:authorize="hasAnyRole('ADMIN', 'GESTOR_MARKETING')">
                <a th:href="@{/anuncios/novo}" class="btn btn-primary">+ Novo Anúncio</a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="small">
                    <tr>
                        <th>ID</th>
                        <th>Anúncio</th>
                        <th>Campanha / Conta</th>
                        <th>Formato</th>
                        <th>Teste A/B</th>
                        <th>Linha Criativa</th>
                        <th>Nota</th>
                        <th>Status</th>
                        <th class="text-end" sec:authorize="hasAnyRole('ADMIN', 'GESTOR_MARKETING')">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${anuncios}">
                        <td th:text="${a.idAnuncio}">1</td>
                        <td class="fw-semibold" style="color: var(--color-primary-dark);" th:text="${a.nomeAnuncio}">Anúncio</td>
                        <td>
                            <a th:href="@{/campanhas/{id}(id=${a.campanha.idCampanha})}"
                               class="text-decoration-none fw-semibold" style="color: var(--color-primary);"
                               th:text="${a.campanha.nomeCampanha}">Campanha</a>
                            <div class="small text-muted" th:text="${a.campanha.conta.nomeConta}">Conta</div>
                        </td>
                        <td th:text="${a.formato}">Vídeo</td>
                        <td><span class="badge bg-light text-dark border" th:text="${a.versaoTesteAb}">A</span></td>
                        <td th:text="${a.linhaCriativa}">Criativo</td>
                        <td class="fw-bold" style="color: var(--color-primary);" th:text="${a.notaQualidadeCriativo}">9.0</td>
                        <td>
                            <span th:class="${a.statusAnuncio.name() == 'ATIVO' ? 'badge-status-ativo' : (a.statusAnuncio.name() == 'PAUSADO' ? 'badge-status-pausado' : 'badge-status-encerrado')}"
                                  th:text="${a.statusAnuncio}">STATUS</span>
                        </td>
                        <td class="text-end" sec:authorize="hasAnyRole('ADMIN', 'GESTOR_MARKETING')">
                            <a th:href="@{/anuncios/{id}/editar(id=${a.idAnuncio})}" class="btn btn-sm btn-outline-primary">Editar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
