<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criativos & Anúncios &bull; Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css(v=2.0)}">
</head>
<body>

<div class="app-container">
    <div th:replace="~{fragments/navbar :: sidebar('anuncios')}"></div>

    <div class="app-content">
        <div th:replace="~{fragments/navbar :: topbar('Criativos & Anúncios')}"></div>

        <main class="p-3 p-md-4 flex-grow-1">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h4 class="fw-bold text-white mb-1">
                        <i class="bi bi-collection-play-fill me-2" style="color: var(--hs-amber);"></i>Criativos & Anúncios
                    </h4>
                    <p class="small mb-0" style="color: var(--hs-text-muted);">
                        Peças publicitárias vinculadas a campanhas, testes A/B e índices de qualidade (560 peças)
                    </p>
                </div>
                <div sec:authorize="hasAnyRole('ADMIN', 'GESTOR_MARKETING')">
                    <a th:href="@{/anuncios/novo}" class="btn-hs-primary">
                        <i class="bi bi-plus-lg"></i> Novo Anúncio
                    </a>
                </div>
            </div>

            <div class="hs-card">
                <div class="table-responsive">
                    <table class="table-dark-saas">
                        <thead>
                        <tr>
                            <th class="d-none d-sm-table-cell" style="width: 50px;">ID</th>
                            <th>Anúncio</th>
                            <th class="d-none d-md-table-cell">Campanha / Conta</th>
                            <th class="d-none d-lg-table-cell">Formato</th>
                            <th class="table-nowrap">Teste A/B</th>
                            <th class="d-none d-xl-table-cell">Linha Criativa</th>
                            <th class="d-none d-sm-table-cell table-nowrap">Nota</th>
                            <th class="table-nowrap">Status</th>
                            <th class="text-end table-nowrap" sec:authorize="hasAnyRole('ADMIN', 'GESTOR_MARKETING')">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${anuncios}">
                            <td class="d-none d-sm-table-cell text-muted" style="font-family: monospace;" th:text="'#' + ${a.idAnuncio}">#1</td>
                            <td>
                                <div class="fw-bold text-white" th:text="${a.nomeAnuncio}">Anúncio</div>
                                <div class="small d-md-none mt-1" style="color: var(--hs-text-muted);">
                                    <span th:text="${a.campanha.nomeCampanha}">Campanha</span> &bull; <span th:text="${a.formato}">Vídeo</span>
                                </div>
                            </td>
                            <td class="d-none d-md-table-cell">
                                <a th:href="@{/campanhas/{id}(id=${a.campanha.idCampanha})}"
                                   class="text-decoration-none fw-semibold" style="color: var(--hs-violet);"
                                   th:text="${a.campanha.nomeCampanha}">Campanha</a>
                                <div class="small" style="color: var(--hs-text-muted);" th:text="${a.campanha.conta.nomeConta}">Conta</div>
                            </td>
                            <td class="d-none d-lg-table-cell">
                                <span class="badge" style="background-color: var(--hs-card-subtle); color: var(--hs-text-body); border: 1px solid var(--hs-border);" th:text="${a.formato}">Vídeo</span>
                            </td>
                            <td class="table-nowrap">
                                <span class="badge px-2" style="background-color: rgba(245, 158, 11, 0.15); color: var(--hs-amber); font-weight: 700; border: 1px solid rgba(245, 158, 11, 0.3);"
                                      th:text="${a.versaoTesteAb}">A</span>
                            </td>
                            <td class="d-none d-xl-table-cell" style="color: var(--hs-text-muted);" th:text="${a.linhaCriativa}">Criativo</td>
                            <td class="d-none d-sm-table-cell table-nowrap">
                                <span class="fw-bold text-white" th:text="${a.notaQualidadeCriativo}">9.0</span>
                                <small style="color: var(--hs-text-faint);">/10</small>
                            </td>
                            <td class="table-nowrap">
                                <span class="hs-status-pill"
                                      th:classappend="${a.statusAnuncio.name() == 'ATIVO' ? 'hs-status-ativo' : (a.statusAnuncio.name() == 'PAUSADO' ? 'hs-status-pausado' : 'hs-status-encerrado')}">
                                    <span style="width: 6px; height: 6px; border-radius: 50%; background-color: currentColor;"></span>
                                    <span th:text="${a.statusAnuncio}">STATUS</span>
                                </span>
                            </td>
                            <td class="text-end table-nowrap" sec:authorize="hasAnyRole('ADMIN', 'GESTOR_MARKETING')">
                                <a th:href="@{/anuncios/{id}/editar(id=${a.idAnuncio})}" class="btn-hs-outline btn-sm">
                                    <i class="bi bi-pencil"></i> Editar
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
