<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas Anunciantes — Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<div class="main-wrapper">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container pb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0" style="color: var(--color-primary-dark);">Contas Anunciantes</h3>
                <p class="text-muted small mb-0">Carteira de clientes, segmentação e porte empresarial</p>
            </div>
            <div sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/contas/nova}" class="btn btn-primary">+ Nova Conta (Exclusivo ADMIN)</a>
            </div>
        </div>

        <div th:if="${mensagemSucesso}" class="alert alert-success py-2 shadow-sm" th:text="${mensagemSucesso}"></div>
        <div th:if="${mensagemErro}" class="alert alert-danger py-2 shadow-sm" th:text="${mensagemErro}"></div>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="small">
                    <tr>
                        <th>ID</th>
                        <th>Nome da Conta</th>
                        <th>Segmento / Produto</th>
                        <th>Porte</th>
                        <th>Localização (<code>@Embedded</code>)</th>
                        <th>Cliente Desde</th>
                        <th>Status</th>
                        <th class="text-end" sec:authorize="hasRole('ADMIN')">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ct : ${contas}">
                        <td th:text="${ct.idConta}">1</td>
                        <td class="fw-semibold" style="color: var(--color-primary-dark);" th:text="${ct.nomeConta}">Conta</td>
                        <td>
                            <span th:text="${ct.segmento}">Segmento</span>
                            <div class="small text-muted" th:text="${ct.produtoPrincipal}">Produto</div>
                        </td>
                        <td th:text="${ct.porteEmpresa}">Porte</td>
                        <td>
                            <span th:text="${ct.localizacao.cidade + ' - ' + ct.localizacao.estado}">Cidade - UF</span>
                            <span class="badge" style="background-color: var(--color-primary-light); color: var(--color-primary-dark);"
                                  th:text="${ct.localizacao.regiao}">Região</span>
                        </td>
                        <td th:text="${ct.anoInicioCliente}">2024</td>
                        <td>
                            <span th:class="${ct.statusConta.name() == 'ATIVO' ? 'badge-status-ativo' : 'badge-status-inativo'}"
                                  th:text="${ct.statusConta}">STATUS</span>
                        </td>
                        <td class="text-end" sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/contas/{id}/editar(id=${ct.idConta})}" class="btn btn-sm btn-outline-primary">Editar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
