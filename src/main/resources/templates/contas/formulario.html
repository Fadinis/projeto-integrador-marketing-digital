<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Conta — Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<div class="main-wrapper">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container pb-5" style="max-width: 720px;">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="fw-bold mb-0" style="color: var(--color-primary-dark);"
                    th:text="${conta.idConta == null ? 'Nova Conta Anunciante' : 'Editar Conta #' + conta.idConta}">Conta</h5>
            </div>
            <div class="card-body p-4">

                <div th:if="${mensagemErro}" class="alert alert-danger py-2 shadow-sm" th:text="${mensagemErro}"></div>

                <form th:action="@{/contas/salvar}" th:object="${conta}" method="post">
                    <input type="hidden" th:field="*{idConta}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nome da Conta *</label>
                            <input type="text" class="form-control" th:field="*{nomeConta}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('nomeConta')}" th:errors="*{nomeConta}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Segmento *</label>
                            <input type="text" class="form-control" th:field="*{segmento}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Produto Principal *</label>
                            <input type="text" class="form-control" th:field="*{produtoPrincipal}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Porte da Empresa *</label>
                            <select class="form-select" th:field="*{porteEmpresa}" required>
                                <option value="Pequeno porte">Pequeno porte</option>
                                <option value="Médio porte">Médio porte</option>
                                <option value="Grande porte">Grande porte</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Ano Início Cliente *</label>
                            <input type="number" min="2000" max="2030" class="form-control" th:field="*{anoInicioCliente}" required>
                        </div>

                        <div class="col-md-5">
                            <label class="form-label fw-semibold">Cidade *</label>
                            <input type="text" class="form-control" th:field="*{localizacao.cidade}" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Estado (UF) *</label>
                            <input type="text" maxlength="2" class="form-control" th:field="*{localizacao.estado}" placeholder="SP" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Região *</label>
                            <select class="form-select" th:field="*{localizacao.regiao}" required>
                                <option value="Sudeste">Sudeste</option>
                                <option value="Sul">Sul</option>
                                <option value="Nordeste">Nordeste</option>
                                <option value="Centro-Oeste">Centro-Oeste</option>
                                <option value="Norte">Norte</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Status da Conta *</label>
                            <select class="form-select" th:field="*{statusConta}" required>
                                <option th:each="st : ${statusOpcoes}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/contas}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar Conta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
