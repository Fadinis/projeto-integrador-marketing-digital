<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Campanha — Marketing Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<div class="main-wrapper">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container pb-5" style="max-width: 820px;">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="fw-bold mb-0" style="color: var(--color-primary-dark);"
                    th:text="${campanha.idCampanha == null ? 'Nova Campanha' : 'Editar Campanha #' + campanha.idCampanha}">Campanha</h5>
            </div>
            <div class="card-body p-4">

                <div th:if="${mensagemErro}" class="alert alert-danger py-2 shadow-sm" th:text="${mensagemErro}"></div>

                <form th:action="@{/campanhas/salvar}" th:object="${campanha}" method="post">
                    <input type="hidden" th:field="*{idCampanha}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Conta Anunciante *</label>
                            <select class="form-select" th:field="*{conta.idConta}" required>
                                <option value="">Selecione uma conta...</option>
                                <option th:each="ct : ${contas}"
                                        th:value="${ct.idConta}"
                                        th:text="${ct.nomeConta + ' (' + ct.statusConta + ')'}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('conta')}" th:errors="*{conta}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nome da Campanha *</label>
                            <input type="text" class="form-control" th:field="*{nomeCampanha}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('nomeCampanha')}" th:errors="*{nomeCampanha}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Canal *</label>
                            <input type="text" class="form-control" th:field="*{canal}" placeholder="Ex: Google Ads, SEO, Meta Ads" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('canal')}" th:errors="*{canal}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Objetivo *</label>
                            <input type="text" class="form-control" th:field="*{objetivo}" placeholder="Ex: Conversão, Leads" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('objetivo')}" th:errors="*{objetivo}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Posição no Funil *</label>
                            <select class="form-select" th:field="*{posicaoFunil}" required>
                                <option value="Topo de funil">Topo de funil</option>
                                <option value="Meio de funil">Meio de funil</option>
                                <option value="Fundo de funil">Fundo de funil</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Segmento *</label>
                            <input type="text" class="form-control" th:field="*{segmento}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Produto *</label>
                            <input type="text" class="form-control" th:field="*{produto}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Abrangência Geográfica *</label>
                            <input type="text" class="form-control" th:field="*{abrangenciaGeografica}" placeholder="Ex: Nacional, Sudeste" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Data de Início *</label>
                            <input type="date" class="form-control" th:field="*{dataInicio}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('dataInicio')}" th:errors="*{dataInicio}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Data de Fim *</label>
                            <input type="date" class="form-control" th:field="*{dataFim}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('dataFim')}" th:errors="*{dataFim}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Orçamento Planejado (R$) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{orcamentoPlanejado}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('orcamentoPlanejado')}" th:errors="*{orcamentoPlanejado}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Status *</label>
                            <select class="form-select" th:field="*{statusCampanha}" required>
                                <option th:each="st : ${statusOpcoes}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/campanhas}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar Campanha</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
